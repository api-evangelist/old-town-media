description: Old Town Media is a New York City media consulting and investment firm founded in 2017 by
  journalists Tom McGeveran and Josh Benson together with media operations executive Katherine Lehr. The
  firm helps launch and grow journalist-founded news organizations (The Colorado Sun, Block Club Chicago,
  Documented), consults with established media companies (Chalkbeat, The Marshall Project, Medium) on
  revenue and sustainability, brokers media-technology partnerships, and runs a venture fund for
  early-stage media investments. It publishes no public API, developer platform, SDK, or technical
  product surface.
